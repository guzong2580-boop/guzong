name: 학사일정 변경 감지

on:
  schedule:
    # 매일 오전 9시 (KST) = UTC 00:00
    - cron: '3 0 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r 학사일정모니터/requirements.txt

      - name: Run monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python 학사일정모니터/monitor.py

      - name: Commit cache update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 학사일정모니터/last_schedule.txt
          git diff --cached --quiet || git commit -m "학사일정 캐시 업데이트"
          git push
